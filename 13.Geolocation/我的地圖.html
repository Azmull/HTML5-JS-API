<!doctype html>
<html lang="en">

<head>
  <title></title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <link type="text/css" rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link type="text/css" rel="stylesheet"
    href="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/themes/south-street/jquery-ui.css">
  <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
  <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
  <!-- 引入 leaflet.css -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- 引入 leaflet.js -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</head>

<body class="p-4">

  <h1>我的地圖</h1>
  <hr>

  <div>
    <button onclick="getLocation()">getLocation</button>
    <div id="myMap" style="width:100%;height: 800px;"></div>
  </div>

  <script>
    var map = L.map('myMap').setView([23.5, 121], 8);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '彩虹小馬' }).addTo(map);
    function getLocation() {
      navigator.geolocation.getCurrentPosition(function (position) {
        console.log(position);
        map.setView([position.coords.latitude, position.coords.longitude], 13);
        L.marker([position.coords.latitude, position.coords.longitude], { title: '當前位置' }).addTo(map)
      })
    }
  </script>

</body>

</html>
