<!doctype html>
<html lang="en">

<head>
  <title></title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <link type="text/css" rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link type="text/css" rel="stylesheet"
    href="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/themes/south-street/jquery-ui.css">
  <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
  <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>


  <!-- 引入 jquery.signature -->
  <script type="text/javascript" src="jquery.signature.min.js"></script>
</head>

<body class="p-4">

  <h1>我的簽名</h1>
  <hr>

  <div>
    <div id="sig" style="width: 100%; height: 300px; border: 1px solid green;"></div>
    <button onclick="toJsonFormat()">轉為json格式</button>
  </div>

  <script>
    var mySig;
    $(function () {
      mySig = $('#sig').signature();
    });
    function toJsonFormat() {
      alert(mySig.signature('toJSON'));
    }

  </script>

</body>

</html>
