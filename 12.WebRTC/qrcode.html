<!doctype html>
<html lang="en">

<head>
  <title></title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <link type="text/css" rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link type="text/css" rel="stylesheet"
    href="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/themes/south-street/jquery-ui.css">
  <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
  <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
  <!-- 引入 Instascan.js -->
  <script type="text/javascript" src="https://rawgit.com/schmich/instascan-builds/master/instascan.min.js"></script>
</head>

<body class="p-4">

  <h1>我的QRcode</h1>
  <hr>

  <div>
    <div id="myScanner"></div>
    <div id="result"></div>
  </div>

  <script>
    let myVideo = document.querySelector("#myScanner");
    let result = document.querySelector("#result");

    let scanner = new Instascan.Scanner({ video: myVideo });
    scanner.addListener('scan', function (content) {
      console.log(content)
      result
    });

    Instascan.Camera.getCameras().then(
      function (cameras) {
        if (cameras.length > 0) {
          scanner.start(cameras[0]);
        } else { alert('沒有相機可用') }
      }
    )
  </script>

</body>

</html>
